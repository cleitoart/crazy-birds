<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宝箱高光时刻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Titan+One&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
@property --bg1 { syntax: '<color>'; inherits: true; initial-value: #12503A; }
@property --bg2 { syntax: '<color>'; inherits: true; initial-value: #061A12; }
@property --ray { syntax: '<color>'; inherits: true; initial-value: #A8FF8E; }
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

:root {
  --ink: #1A1033;
  --main: #46C94F; --light: #B8FF8C; --dark: #17692E;
  --bg1: #12503A; --bg2: #061A12; --ray: #A8FF8E;
  --cx: 50%; --cy: 55%;
  --fx: 50%; --fy: 55%;
  --cw: clamp(60px, 16.5vw, 128px);
  --font: 'Lilita One', 'ZCOOL KuaiLe', system-ui, sans-serif;
  --zh: 'ZCOOL KuaiLe', 'Lilita One', system-ui, sans-serif;
  transition: --bg1 .6s ease, --bg2 .6s ease, --ray .6s ease;
}
html[lang="pt"] { --zh: 'Lilita One', system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0618; }
body { font-family: var(--font); color: #fff; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#app { position: fixed; inset: 0; overflow: hidden; cursor: pointer; }
#world { position: absolute; inset: 0; will-change: transform; }

/* ---------- background ---------- */
#bg { position: absolute; inset: -40px; z-index: 0; overflow: hidden;
  background: radial-gradient(ellipse 120% 90% at var(--cx) var(--cy), var(--bg1) 0%, var(--bg2) 78%); }
.rays { position: absolute; left: var(--cx); top: var(--cy); width: 170vmax; height: 170vmax;
  margin: -85vmax 0 0 -85vmax; border-radius: 50%; pointer-events: none; will-change: transform;
  -webkit-mask-image: radial-gradient(circle closest-side, #000 0%, rgba(0,0,0,.55) 30%, transparent 85%);
          mask-image: radial-gradient(circle closest-side, #000 0%, rgba(0,0,0,.55) 30%, transparent 85%); }
.rays.r1 { background: repeating-conic-gradient(from 0deg, transparent 0deg,
  color-mix(in srgb, var(--ray) 20%, transparent) 7deg, transparent 15deg);
  animation: spin 70s linear infinite; }
.rays.r2 { background: repeating-conic-gradient(from 4deg, transparent 0deg,
  color-mix(in srgb, var(--ray) 13%, transparent) 12deg, transparent 26deg);
  animation: spin 110s linear infinite reverse; }
.rays.r3 { background: repeating-conic-gradient(from 2deg, transparent 0deg,
  color-mix(in srgb, #ffffff 7%, transparent) 3deg, transparent 6deg);
  animation: spin 160s linear infinite; opacity: .8; }
#bgDim { position: absolute; inset: 0; background: #07020f; opacity: 0; }
.vig { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 80% at 50% 50%, transparent 55%, rgba(8,3,20,.65) 100%); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- reveal curtain ---------- */
#curtain { position: absolute; inset: -40px; z-index: 1; opacity: 0; visibility: hidden; overflow: hidden;
  background: radial-gradient(ellipse 80% 70% at 50% 42%, var(--c1, #6b3a06) 0%, var(--c2, #1e0b02) 85%); }
#curtain .soft { position: absolute; left: 50%; top: 42%; width: 200vmax; height: 200vmax; margin: -100vmax 0 0 -100vmax;
  background: conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,.16) 25deg, transparent 60deg,
    transparent 150deg, rgba(255,255,255,.1) 185deg, transparent 225deg, transparent 290deg, rgba(255,255,255,.12) 320deg, transparent 350deg);
  animation: spin 38s linear infinite; will-change: transform;
  -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 38%); mask-image: radial-gradient(circle, #000 0%, transparent 38%); }
#curtain .soft.s2 { animation-duration: 64s; animation-direction: reverse; opacity: .6; }

/* ---------- light beams & hero glow (both BEHIND the 3D canvas) ---------- */
#beams { position: absolute; z-index: 2; left: 0; top: 0; width: 0; height: 0; opacity: 0; pointer-events: none; }
#beams .beam { position: absolute; left: 0; bottom: 0; width: 120px; height: 62vh; margin-left: -60px;
  transform-origin: 50% 100%; filter: blur(9px); mix-blend-mode: screen; }
#beams .beam i { position: absolute; inset: 0; display: block;
  clip-path: polygon(44% 100%, 56% 100%, 100% 0, 0 0);
  background: linear-gradient(to top, #fff 0%, color-mix(in srgb, var(--light) 85%, transparent) 18%,
    color-mix(in srgb, var(--main) 45%, transparent) 55%, transparent 100%); }
#beams .core { position: absolute; left: -170px; top: -150px; width: 340px; height: 300px; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(255,255,255,.95) 0%, color-mix(in srgb, var(--light) 70%, transparent) 25%,
    color-mix(in srgb, var(--main) 30%, transparent) 50%, transparent 70%); filter: blur(6px); mix-blend-mode: screen; }
#heroGlow { position: absolute; z-index: 2; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%; opacity: 0;
  pointer-events: none; transform: translate(-50%, -50%);
  background: radial-gradient(circle, color-mix(in srgb, var(--light) 95%, #fff) 0%, color-mix(in srgb, var(--light) 70%, transparent) 30%,
    color-mix(in srgb, var(--main) 40%, transparent) 50%, transparent 70%); }

canvas.layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: block; }
#fxBack { z-index: 3; }
#gl { z-index: 4; }
#fx { z-index: 5; }
#flash { position: absolute; inset: 0; z-index: 6; opacity: 0; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(circle min(62vmax, 820px) at var(--fx) var(--fy), color-mix(in srgb, var(--light) 60%, #fff) 0%,
    color-mix(in srgb, var(--light) 55%, transparent) 16%, color-mix(in srgb, var(--main) 22%, transparent) 42%, transparent 100%); }
#fxTop { z-index: 30; }

/* ---------- UI ---------- */
#ui { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#titleWrap { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 64px); display: flex; flex-direction: column; align-items: center; }
#title { font-family: 'Titan One', var(--font); font-size: clamp(40px, 8.4vw, 88px); line-height: 1; letter-spacing: .02em;
  white-space: nowrap; filter: drop-shadow(0 7px 0 rgba(26,16,51,.55)); height: 1.15em; }
#title .ch { position: relative; display: inline-block; z-index: 0; transform-origin: 50% 90%; }
#title .ch::before { content: attr(data-c); position: absolute; left: 0; top: 0; z-index: -1; color: var(--ink);
  -webkit-text-stroke: .2em var(--ink); }
#title .ch i { font-style: normal; background: linear-gradient(180deg, #fff 0%, #fff 22%, var(--light) 40%, var(--main) 82%, var(--dark) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; }

.metal { border: 3px solid var(--ink);
  box-shadow: inset 3px 3px 0 rgba(255,255,255,.6), inset -3px -4px 0 rgba(0,0,0,.28), inset 0 0 14px rgba(0,0,0,.18), 0 5px 0 var(--ink), 0 9px 16px rgba(0,0,0,.35); }
.m0 { background: repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 1px, transparent 1px 3px),
  linear-gradient(170deg, #F2F5FA 0%, #B9C3D3 40%, #8490A5 60%, #5E687C 100%); }
.m1 { background: repeating-linear-gradient(90deg, rgba(255,255,255,.1) 0 1px, transparent 1px 3px),
  linear-gradient(170deg, #FFFFFF 0%, #D6E4F5 38%, #9DB1CB 62%, #6D84A6 100%); }
.m2 { background: repeating-linear-gradient(90deg, rgba(255,255,255,.1) 0 1px, transparent 1px 3px),
  linear-gradient(170deg, #FFFFFF 0%, #E6DAFF 38%, #B49BE0 62%, #7C5DB5 100%); }
.m3 { background: repeating-linear-gradient(90deg, rgba(255,255,255,.12) 0 1px, transparent 1px 3px),
  linear-gradient(170deg, #FFFBE0 0%, #FFE27A 34%, #F4B42C 60%, #B86E0C 100%); }

.plate { position: relative; margin-top: 8px; padding: 6px 46px 8px; border-radius: 14px; pointer-events: none;
  font-family: var(--zh); font-size: clamp(17px, 3.2vw, 24px); color: #fff; letter-spacing: .06em;
  text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink); }
.inl { position: absolute; top: 50%; width: 20px; height: 20px; margin-top: -10px; border-radius: 50%; border: 2.5px solid var(--ink); }
.inl.l { left: 12px; } .inl.r { right: 12px; }
.t0 .inl, .rar0 .inl { background: radial-gradient(circle at 35% 30%, #fff 0 12%, #C9D1DE 22%, #7B869A 70%, #4A5366 100%); width: 16px; height: 16px; margin-top: -8px; }
.t1 .inl, .rar1 .inl { background: radial-gradient(circle at 38% 32%, #fff 0 10%, #7FE3FF 22%, #1E7FE0 62%, #0E3E8C 72%, #E9EFF7 73%, #9FB0C8 100%); }
.t2 .inl, .rar2 .inl { background: radial-gradient(circle at 38% 32%, #fff 0 10%, #FF9BEA 22%, #C72FB5 62%, #6A1466 72%, #F4EEFF 73%, #B7A2DC 100%); }
.t3 .inl, .rar3 .inl { background: radial-gradient(circle at 50% 50%, transparent 0 46%, #FFE58A 48%, #D0901C 100%); }
.t3 .inl::after, .rar3 .inl::after { content: ''; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
  transform: rotate(45deg); background: linear-gradient(135deg, #fff 0 40%, #BFF7FF 41%, #6ED7F0 100%); border: 1.5px solid var(--ink); }
.crown { position: absolute; left: 50%; top: -24px; width: 40px; height: 28px; margin-left: -20px; display: none; }
.t3 .crown, .rar3 .crown { display: block; }
.crown svg { width: 100%; height: 100%; display: block; }

#prompt { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 34px); transform: translateX(-50%);
  display: flex; align-items: center; justify-content: center; width: 180px; height: 70px; }
#prompt b { position: relative; font-family: var(--zh); font-weight: normal; font-size: 30px; letter-spacing: .12em; white-space: nowrap;
  text-shadow: 0 3px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink);
  animation: bob 1.1s ease-in-out infinite; }
#prompt .ring { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
  border: 3px solid color-mix(in srgb, var(--light) 80%, #fff); opacity: 0; animation: ping 1.6s ease-out infinite; }
#prompt .ring.r2 { animation-delay: .8s; }
@keyframes bob { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.06); } }
@keyframes ping { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(2.4); opacity: 0; } }

/* ---------- info panel ---------- */
#panel { position: absolute; width: min(330px, 88vw); padding: 16px 20px 14px; border-radius: 20px; opacity: 0; visibility: hidden; color: #fff; }
#panel .pTag { position: absolute; top: -16px; left: 18px; padding: 3px 14px 4px; border-radius: 10px; font-family: var(--zh); font-size: 16px;
  background: linear-gradient(180deg, var(--light), var(--main)); border: 3px solid var(--ink); color: var(--ink); }
#panel .pName { font-family: var(--zh); font-size: 25px; margin: 6px 0 10px; letter-spacing: .04em; color: #fff;
  text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink); }
#panel .row { display: grid; grid-template-columns: 62px 1fr 58px 50px; align-items: center; gap: 7px; margin: 9px 0; position: relative; }
#panel .lab { font-family: var(--zh); font-size: 16px; color: var(--ink); }
#panel .bar { height: 14px; border-radius: 8px; background: rgba(26,16,51,.35); border: 2.5px solid var(--ink); overflow: hidden; }
#panel .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(180deg, #fff 0 20%, var(--light) 30%, var(--main) 100%); }
#panel .val { font-family: 'Lilita One', sans-serif; font-size: 22px; text-align: right; font-weight: normal; color: #fff;
  text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }
#panel .up { font-style: normal; font-family: 'Lilita One', sans-serif; font-size: 17px; color: #7DFF6B; opacity: 0; white-space: nowrap;
  text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }

/* ---------- cards ---------- */
#cards { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 108px); display: flex; justify-content: center;
  gap: clamp(6px, 1.6vw, 18px); padding: 0 10px; }
.card { position: relative; width: var(--cw); flex: 0 0 auto; opacity: 0; }
.card .cf { position: relative; border-radius: 14px; padding: 5px; }
.card canvas { display: block; width: 100%; aspect-ratio: 1 / 1.15; border-radius: 9px; border: 2.5px solid var(--ink); background: #222; }
.card .qty { position: absolute; left: 0; right: 0; bottom: -16px; text-align: center; font-family: 'Lilita One', sans-serif;
  font-size: calc(var(--cw) * .24); color: #fff; line-height: 1;
  text-shadow: 0 3px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink); }
.card .inl { top: 10px; margin-top: 0; width: 14px; height: 14px; }
.card .inl.l { left: -5px; } .card .inl.r { right: -5px; }
.card.rar0 .inl { width: 12px; height: 12px; }
.card .crown { top: -20px; width: 32px; height: 22px; margin-left: -16px; z-index: 2; }
.card .rb { position: absolute; inset: -5px; border-radius: 18px; display: none;
  background: conic-gradient(from var(--ang), #ff4d6d, #ffb03a, #fff05a, #5dff8a, #45d4ff, #7b6bff, #ff5ce1, #ff4d6d);
  animation: rb 2.4s linear infinite; }
.card .rb::after { content: ''; position: absolute; inset: -4px; border-radius: 20px; background: inherit; filter: blur(9px); opacity: .75; z-index: -1; }
.card.rainbow .rb { display: block; }
@keyframes rb { to { --ang: 360deg; } }
.card .badge { position: absolute; right: -12px; top: -12px; padding: 3px 7px 4px; border-radius: 9px; transform: rotate(12deg); display: none; z-index: 3;
  font-family: 'Lilita One', sans-serif; font-size: calc(var(--cw) * .15); color: #fff; background: linear-gradient(180deg, #FF7A6B, #E8233F);
  border: 2.5px solid var(--ink); box-shadow: inset 2px 2px 0 rgba(255,255,255,.5), 0 3px 0 var(--ink); }
.card.isnew .badge { display: block; }

/* ---------- buttons ---------- */
#actions { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 26px); display: flex; justify-content: center; }
.btn { pointer-events: auto; cursor: pointer; font-family: var(--zh); font-size: 25px; letter-spacing: .12em; color: #fff; min-width: 170px; padding: 9px 26px 11px;
  border-radius: 16px; opacity: 0; visibility: hidden; position: relative;
  text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink); }
.btn:active { transform: translateY(3px) !important; box-shadow: inset 3px 3px 0 rgba(255,255,255,.6), inset -3px -4px 0 rgba(0,0,0,.28), 0 2px 0 var(--ink); }
.btn .inl { width: 14px; height: 14px; margin-top: -7px; }
.btn .inl.l { left: 10px; } .btn .inl.r { right: 10px; }

/* ---------- HUD ---------- */
#hud { position: absolute; z-index: 20; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 10px) 12px 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.seg { display: flex; border-radius: 13px; overflow: hidden; background: rgba(26,16,51,.55); padding: 3px; gap: 3px; border: 3px solid var(--ink); }
.seg button { font-family: var(--zh); font-size: 14px; color: #d8cfff; background: transparent; border: 0; border-radius: 9px; padding: 5px 10px 6px; cursor: pointer; white-space: nowrap; }
.seg button.on { color: #fff; background: linear-gradient(180deg, #8C7BFF, #5A43D6); box-shadow: inset 2px 2px 0 rgba(255,255,255,.4), inset -2px -2px 0 rgba(0,0,0,.25);
  text-shadow: 0 2px 0 var(--ink); }
.hr { display: flex; align-items: center; gap: 8px; }
.pill { position: relative; display: flex; align-items: center; height: 34px; padding: 0 12px 0 34px; border-radius: 17px; min-width: 88px;
  background: rgba(26,16,51,.72); border: 3px solid var(--ink); box-shadow: inset 0 2px 0 rgba(255,255,255,.15), 0 3px 0 var(--ink);
  font-family: 'Lilita One', sans-serif; font-size: 18px; color: #fff; }
.pill svg { position: absolute; left: -6px; top: 50%; width: 38px; height: 38px; margin-top: -19px; }
.pill b { font-weight: normal; margin-left: auto; text-shadow: 0 2px 0 var(--ink); }
.ib { width: 38px; height: 38px; border-radius: 12px; cursor: pointer; display: grid; place-items: center; padding: 0; font-family: 'Lilita One', sans-serif; font-size: 14px; color: var(--ink); }
.ib svg { width: 22px; height: 22px; }
@media (max-width: 560px) {
  .seg button { font-size: 12px; padding: 5px 7px 6px; }
  .pill { min-width: 70px; font-size: 15px; height: 30px; padding-left: 30px; }
  .pill svg { width: 32px; height: 32px; margin-top: -16px; }
  .ib { width: 32px; height: 32px; border-radius: 10px; }
  .ib svg { width: 18px; height: 18px; }
  #titleWrap { top: calc(env(safe-area-inset-top) + 58px); }
  .hr { gap: 5px; }
  #hud { padding-left: 8px; padding-right: 8px; }
}
@media (max-width: 380px) { .pill { min-width: 60px; } #langBtn { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .rays, #curtain .soft { animation-duration: 400s !important; }
  #prompt b, #prompt .ring { animation: none; }
  #prompt .ring { opacity: .5; }
}
#err { position: absolute; inset: auto 0 40% 0; text-align: center; font-family: var(--zh); z-index: 50; display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="world">
    <div id="bg"><div class="rays r1"></div><div class="rays r2"></div><div class="rays r3"></div><div class="vig"></div><div id="bgDim"></div></div>
    <div id="curtain"><div class="soft"></div><div class="soft s2"></div></div>
    <div id="beams"><div class="core"></div></div>
    <div id="heroGlow"></div>
    <canvas id="fxBack" class="layer"></canvas>
    <canvas id="gl" class="layer"></canvas>
    <canvas id="fx" class="layer"></canvas>
    <div id="flash"></div>
  </div>

  <div id="ui">
    <div id="titleWrap">
      <div id="title"></div>
      <div id="plate" class="plate metal m0 t0"><i class="inl l"></i><span id="plateText"></span><i class="inl r"></i><i class="crown"></i></div>
    </div>
    <div id="prompt"><span class="ring"></span><span class="ring r2"></span><b id="promptText"></b></div>
    <div id="panel" class="metal m3">
      <div class="pTag" id="pTag"></div>
      <div class="pName" id="pName"></div>
      <div class="row" data-k="atk"><span class="lab"></span><div class="bar"><i></i></div><b class="val">0</b><em class="up"></em></div>
      <div class="row" data-k="crit"><span class="lab"></span><div class="bar"><i></i></div><b class="val">0</b><em class="up"></em></div>
      <div class="row" data-k="luck"><span class="lab"></span><div class="bar"><i></i></div><b class="val">0</b><em class="up"></em></div>
    </div>
    <div id="cards"></div>
    <div id="actions"><button id="btnMain" class="btn metal m3" type="button"><i class="inl l"></i><span id="btnText"></span><i class="inl r"></i></button></div>
  </div>

  <canvas id="fxTop" class="layer"></canvas>

  <div id="hud">
    <div class="seg" id="modeSeg">
      <button type="button" data-mode="auto" class="on" id="modeAuto"></button>
      <button type="button" data-mode="step" id="modeStep"></button>
    </div>
    <div class="hr">
      <div class="pill" id="pillCoin">
        <svg viewBox="0 0 40 40"><ellipse cx="20" cy="22" rx="15" ry="15" fill="#E8931A" stroke="#1A1033" stroke-width="3"/><circle cx="20" cy="20" r="14.5" fill="#FFC93C" stroke="#1A1033" stroke-width="3"/><path d="M11 15a10 10 0 0 1 7-5" stroke="#FFF4B0" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="20" cy="20" r="9" fill="none" stroke="#C97A10" stroke-width="2"/><path d="M20 14l1.8 3.7 4 .5-3 2.7.8 4-3.6-2-3.6 2 .8-4-3-2.7 4-.5z" fill="#FFF0A0" stroke="#1A1033" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <b id="balCoin">0</b>
      </div>
      <div class="pill" id="pillGem">
        <svg viewBox="0 0 40 40"><path d="M8 15l6-7h12l6 7-12 17z" fill="#1E9BD8" stroke="#1A1033" stroke-width="3" stroke-linejoin="round"/><path d="M8 15h24L20 32z" fill="#4FE3FF"/><path d="M14 8l-6 7h24l-6-7z" fill="#A8F3FF"/><path d="M8 15h24M14 8l2 7 4 17 4-17 2-7M16 15l4-7 4 7" fill="none" stroke="#1A1033" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 15l6-7h12l6 7-12 17z" fill="none" stroke="#1A1033" stroke-width="3" stroke-linejoin="round"/></svg>
        <b id="balGem">0</b>
      </div>
      <button type="button" class="ib metal m0" id="langBtn">PT</button>
      <button type="button" class="ib metal m0" id="muteBtn" aria-label="mute"></button>
    </div>
  </div>
  <div id="err"></div>
</div>

}

}

}
const shakeState = { a: 0 };

/* ---- light pillar: 5-7 blurred beams in a fan ---- */
const beamsEl = $('#beams');
function buildBeams(n) {
  beamsEl.querySelectorAll('.beam').forEach(b => b.remove());
  for (let i = 0; i < n; i++) {
    const b = document.createElement('div'); b.className = 'beam'; b.innerHTML = '<i></i>';
    const k = n === 1 ? 0 : i / (n - 1) - .5;
    b.style.transform = `rotate(${k * 70}deg)`; b.style.width = (i % 2 ? 90 : 130) + 'px'; b.style.marginLeft = -(i % 2 ? 45 : 65) + 'px';
    beamsEl.insertBefore(b, beamsEl.firstChild);

}
function beamsOn(tier) {

/* =====================================================================
   11. PHASE 3 — charge (~1.15 s): shake ramps, light leaks, particles sucked in
   ===================================================================== */
function charge() {
  setPhase('charge');
  const T = TIERS[S.tier];
  const stopRiser = Sfx.riser(CFG.chargeTime + .12);
  const C = { p: 0 }; let acc = 0, lastT = 0;
  gsap.to('#bgDim', { opacity: .35, duration: CFG.chargeTime });
  const tl = gsap.timeline();
  tl.to(C, { p: 1, duration: CFG.chargeTime, ease: 'power1.in', onUpdate: () => {
    const p = C.p, amp = .012 + .09 * p * p;
    shakeG.position.x = rand(-amp, amp); shakeG.position.z = rand(-amp, amp) * .5;
    shakeG.rotation.z = rand(-amp, amp) * .9; shakeG.rotation.x = rand(-amp, amp) * .3;
    lidG.rotation.x = -(.02 + .1 * p) * Math.random();
    M.core.emissiveIntensity = 2.2 * p;
    innerL.intensity = 30 * p;
    squashG.scale.set(1 + .06 * p, 1 - .08 * p, 1 + .06 * p);
    const now = tl.time(); acc += (now - lastT) * (40 + 260 * p) * PF; lastT = now;
    const m = SP.mouth;
    while (acc >= 1) { acc -= 1;
      FX.add({ type: Math.random() < .25 ? 'star' : 'spark', mode: 'suck', cx: m.x, cy: m.y, r0: rand(160, 330), ang: rand(0, TAU), w: rand(1.5, 3) * (Math.random() < .5 ? 1 : -1),

    }

    .add(() => { shakeG.position.set(0, 0, 0); shakeG.rotation.set(0, 0, 0); lidG.rotation.x = 0; })
    .to(squashG.scale, { x: 1.32, z: 1.32, y: .58, duration: .13, ease: 'power3.in' })
    .add(() => stopRiser());
  return tlDone(tl);
}

      }

      for (let i = 0; i < n(26); i++) { const a = rand(0, TAU), s = rand(150, 600); FX.add({ type: 'star', x: m.x, y: m.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 150, drag: 2, g: 80, life: rand(.8, 1.5), size: rand(8, 17), color: T.light }); }
      const floor = SP.floor + 30;

      for (let i = 0; i < n(11); i++) FX.add({ type: 'gem', norm: true, x: m.x + rand(-20, 20), y: m.y, vx: rand(-480, 480), vy: rand(-1300, -850), g: 2300, drag: .4, vr: rand(4, 9), life: rand(1.7, 2.3), size: rand(18, 26), floor: floor + rand(-10, 30), fo: .25 });
      if (k > 1) gsap.delayedCall(.24, () => {   // legendary: second wave
        ring(m.x, m.y, 620, T.light, 12, .9, .5); flash(m.x, m.y, .45, .5); screenShake(.5, .4);
        sparkBurst(m.x, m.y, Math.round(60 * PF), T, [500, 1300], { g: 500 });
        for (let i = 0; i < 24 * PF; i++) { const a = rand(0, TAU), s = rand(1100, 1900); FX.add({ type: 'streak', x: m.x, y: m.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, drag: 3.4, life: rand(.4, .7), size: 3, len: 120, color: '#fff' }); }

/* =====================================================================
   13. PHASE 5a — hero stage (epic & legendary): clean curtain, spinning emblem
   ===================================================================== */
function placeMedal(first) {
  const wide = VW / VH > 1.15 && VW > 720;
  const px = wide ? VW * .36 : VW * .5, py = wide ? VH * .54 : VH * .4;
  const p = screenToWorldZ0(px, py);
  const sc = wide ? 1 : clamp(VW / 520, .62, 1);
  medalRoot.position.set(p.x, p.y, 0);
  if (!first) medalRoot.scale.setScalar(sc);
  medalRoot.userData.sc = sc;
  const panel = $('#panel');
  if (wide) { Object.assign(panel.style, { left: (VW * .58) + 'px', top: '50%', bottom: 'auto' }); gsap.set(panel, { xPercent: 0, yPercent: -38 }); }
  else { Object.assign(panel.style, { left: '50%', top: 'auto', bottom: `calc(env(safe-area-inset-bottom) + 96px)` }); gsap.set(panel, { xPercent: -50, yPercent: 0 }); }
  shadowMesh.position.set(p.x, 0, 0);
}
function updateMedalScreen() {
  const c = toScreen(medalRoot.position);
  const s = medalRoot.scale.x;
  const e1 = toScreen(_w.copy(medalRoot.position).add(new THREE.Vector3(1.85 * s, 0, 0)));
  const e2 = toScreen(_w.copy(medalRoot.position).add(new THREE.Vector3(0, 1.3 * s, 0)));
  SP.medal.x = c.x; SP.medal.y = c.y;
  SP.medal.rx = Math.abs(e1.x - c.x) * 1.22; SP.medal.ry = Math.abs(e2.y - c.y) * 1.3;   // orbit fully outside the silhouette
  const hg = $('#heroGlow'), r = Math.abs(e2.y - c.y) * 2.5;
  hg.style.left = c.x + 'px'; hg.style.top = c.y + 'px'; hg.style.width = hg.style.height = r * 2 + 'px';
}
async function heroReveal() {
  setPhase('hero');
  const t = S.finalTier, T = TIERS[t];
  applyMedalColors(t);
  placeMedal(true);
  const sc = medalRoot.userData.sc, target = medalRoot.position.clone();
  updateScreenAnchors(false);
  medalRoot.position.copy(chestRoot.localToWorld(new THREE.Vector3(0, CH.H, 0)));
  medalRoot.scale.setScalar(.05); medalRoot.visible = true; medalSpin.rotation.y = 0;
  S.heroOn = true;
  Sfx.whoosh();
  const tl = gsap.timeline();
  tl.to(medalRoot.position, { x: target.x, y: target.y, duration: .7, ease: 'back.out(1.8)' }, 0)
    .to(medalRoot.scale, { x: sc, y: sc, z: sc, duration: .7, ease: 'back.out(2.2)' }, 0)
    .to(medalSpin.rotation, { y: TAU * 3, duration: 1.6, ease: 'power3.out' }, 0)
    .add(() => {
      // stage takes over: curtain up, other 3D objects hidden (so no stray outlines on the curtain)
      updateMedalScreen();
      flash(SP.medal.x, SP.medal.y, .6, .6);
      chestRoot.visible = false; beamsOff(.15);
      gsap.set('#curtain', { autoAlpha: 1 });
      gsap.fromTo('#curtain', { opacity: .4 }, { opacity: 1, duration: .35 });
      gsap.to('#prompt', { autoAlpha: 0, duration: .1 });
      FX.clear(p => p.type === 'coin' || p.type === 'gem');
    }, .12)
    .to('#heroGlow', { opacity: 1, duration: .6 }, .3)
    .add(() => {
      Sfx.fanfare();
      slamTitle(T.en + '!');
      gsap.set('#plate', { autoAlpha: 1, y: 0 }); setPlate(t, true);
      loops.glow = gsap.to('#heroGlow', { scale: 1.08, duration: 1.3, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      loops.medalSpin = gsap.to(medalSpin.rotation, { y: '+=' + TAU, duration: 6, ease: 'none', repeat: -1 });
      loops.medalBob = gsap.to(medalSpin.position, { y: .08, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      // star-dust orbit (legendary), always outside the silhouette
      if (t >= 3) for (let i = 0; i < 3; i++) FX.add({ type: 'orbit', mode: 'orbit', layer: 0, center: SP.medal, ang: i * TAU / 3, w: 1.6, life: Infinity, size: 4, color: i === 1 ? T.gem : T.light, x: 0, y: 0, vx: 0, vy: 0, heroOrbit: true });
      confetti(t);
      showPanel(t);
    }, .75)
    .to({}, { duration: 1.0 });
  await tlDone(tl);
  S.state = 'hero'; showBtn(L().take);
  if (S.mode === 'auto' && !S.autoOff) loops.auto = gsap.delayedCall(CFG.autoHoldHero, continueFromHero);
}
function confetti(t) {

    FX.add({ type: 'confetti', norm: true, layer: 0, x: dir > 0 ? -10 : VW + 10, y: VH * rand(.55, .95),
      vx: dir * Math.cos(a) * s, vy: -Math.sin(a) * s, g: 800, drag: 1.4, sway: rand(2, 5),
      vr: rand(-6, 6), flip: rand(6, 14), life: rand(2.4, 3.6), size: rand(5, 8), color: pick(cols), fo: .3 });
  }
}
const STATS = [null, null, { atk: [860, 180], crit: [12, 4], luck: [30, 8] }, { atk: [1280, 320], crit: [18, 6], luck: [45, 15] }];
function showPanel(t) {
  const P = $('#panel'), st = STATS[t];
  P.className = `metal m${t}`;
  $('#pTag').textContent = L().rar[t]; $('#pName').textContent = L().emblem[t];
  gsap.fromTo(P, { autoAlpha: 0, x: 40, scale: .85 }, { autoAlpha: 1, x: 0, scale: 1, duration: .55, ease: 'back.out(2)' });
  P.querySelectorAll('.row').forEach((row, i) => {
    const [base, up] = st[row.dataset.k], val = row.querySelector('.val'), bar = row.querySelector('.bar i'), upEl = row.querySelector('.up');
    const suf = row.dataset.k === 'crit' ? '%' : '', max = base + up;

    gsap.timeline({ delay: .35 + i * .22 })

      .add(() => { upEl.textContent = '▲+' + up + suf; Sfx.pop(); })
      .fromTo(upEl, { opacity: 0, y: 10, scale: .5 }, { opacity: 1, y: 0, scale: 1, duration: .45, ease: 'back.out(3)' })
      .to(o, { v: max, duration: .6, ease: 'power2.out', onUpdate: () => { val.textContent = Math.round(o.v) + suf; bar.style.width = (o.v / max * 82) + '%'; Sfx.tick(); } }, '<.1')
      .fromTo(val, { scale: 1.35 }, { scale: 1, duration: .4, ease: 'elastic.out(1.2,.4)' });

}
async function continueFromHero() {

  showBtn(null, false);
  killLoop('glow', 'medalSpin', 'medalBob');
  FX.clear(p => p.heroOrbit);
  const tl = gsap.timeline();
  tl.to('#panel', { autoAlpha: 0, x: 30, duration: .25 }, 0)
    .to('#heroGlow', { opacity: 0, scale: 1, duration: .3 }, 0)
    .to(medalRoot.scale, { x: .01, y: .01, z: .01, duration: .35, ease: 'back.in(2)' }, 0)
    .to(medalSpin.rotation, { y: '+=' + Math.PI * 2, duration: .35, ease: 'power2.in' }, 0)
    .add(() => {

      shadowMesh.position.set(0, 0, 0);
      chestRoot.visible = true;
      gsap.to('#curtain', { autoAlpha: 0, duration: .35 });
    }, .3)
    .to({}, { duration: .3 });
  await tlDone(tl);
  await cardsReveal();
}

/* =====================================================================
   14. PHASE 5b — cards fly out on arcs, overshoot, count up; claim
   ===================================================================== */
function rewardsFor(t) {
  return [
    { kind: 'coin', qty: [180, 320, 560, 980][t], rar: Math.min(t, 1) },
    { kind: 'gem', qty: [8, 16, 32, 64][t], rar: Math.min(t, 2) },
    { kind: 'potion', qty: 3, rar: 1 },
    { kind: 'scroll', qty: [1, 2, 3, 5][t], rar: t >= 2 ? 2 : 1 },
    { kind: 'emblem', qty: 1, rar: t, isNew: true, rainbow: t >= 2 },
  ];
}
let cardEls = [];
async function cardsReveal() {
  setPhase('cards');
  const t = S.finalTier, T = TIERS[t], list = rewardsFor(t);
  gsap.to(view, { shift: 1, zoom: 1, duration: .6, ease: 'power2.inOut', onUpdate: () => updateScreenAnchors(true) });
  gsap.to('#plate', { autoAlpha: 0, y: -10, duration: .3 });
  gsap.to(M.core, { emissiveIntensity: .9, duration: .6 });
  beamsOn(t); gsap.to(beamsEl, { opacity: .55, duration: .6, delay: .3 });
  slamTitle(T.en);
  const box = $('#cards'); box.innerHTML = '';
  cardEls = list.map(r => {
    const el = document.createElement('div');
    el.className = `card rar${r.rar}` + (r.isNew ? ' isnew' : '') + (r.rainbow ? ' rainbow' : '');
    el.innerHTML = `<div class="rb"></div><div class="cf metal m${r.rar}"><canvas></canvas><div class="qty">x<span>0</span></div></div><i class="inl l"></i><i class="inl r"></i><i class="crown">${crownSVG}</i><div class="badge">NEW!</div>`;
    box.appendChild(el); el._r = r; return el;
  });
  await wait(.62);
  updateScreenAnchors(false);
  const m = SP.mouth;
  cardEls.forEach(el => drawCard(el.querySelector('canvas'), el._r.kind, T));
  const tl = gsap.timeline();
  cardEls.forEach((el, i) => {
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const dx = m.x - cx, dy = m.y - cy, ctrlX = dx * .45, ctrlY = Math.min(dy, 0) - 200 - Math.abs(dx) * .15;
    const o = { p: 0 }, spin = (i % 2 ? 1 : -1) * 360;
    gsap.set(el, { x: dx, y: dy, scale: .15, rotation: 0, opacity: 1 });
    tl.add(() => Sfx.pop(), i * .17)
      .to(o, { p: 1, duration: .62, ease: 'power2.out', onUpdate: () => {
        const p = o.p, u = 1 - p;
        gsap.set(el, { x: u * u * dx + 2 * u * p * ctrlX, y: u * u * dy + 2 * u * p * ctrlY, rotation: spin * (1 - p), scale: .15 + .95 * p });
        if (Math.random() < .5) { const rr = el.getBoundingClientRect(); FX.add({ type: 'spark', layer: 2, x: rr.left + rr.width / 2, y: rr.top + rr.height / 2, vx: rand(-40, 40), vy: rand(-40, 40), drag: 3, life: .4, size: 2.6, color: T.light }); }
      } }, i * .17)
      .add(() => {
        const rr = el.getBoundingClientRect();
        sparkBurst(rr.left + rr.width / 2, rr.top + rr.height / 2, Math.round(14 * PF), el._r.rainbow ? TIERS[3] : T, [120, 360], { g: 200, layer: 2 });
        if (el._r.rainbow) ring(rr.left + rr.width / 2, rr.top + rr.height / 2, 130, T.light, 6, .5, 1, 2);
        countQty(el);
      }, i * .17 + .62)
      .to(el, { scale: 1, duration: .7, ease: 'elastic.out(1.2,.35)' }, i * .17 + .62)
      .fromTo(el, { rotation: (i % 2 ? 1 : -1) * 9 }, { rotation: 0, duration: .9, ease: 'elastic.out(1.3,.25)' }, i * .17 + .62);
    if (el._r.isNew) tl.fromTo(el.querySelector('.badge'), { scale: 0, rotation: -40 }, { scale: 1, rotation: 12, duration: .5, ease: 'back.out(3)' }, i * .17 + .8);
  });
  await tlDone(tl);
  await wait(.5);
  S.state = 'cards'; showBtn(L().claim);
  if (S.mode === 'auto' && !S.autoOff) loops.auto = gsap.delayedCall(CFG.autoHoldCards, claim);
}
function countQty(el) {
  const span = el.querySelector('.qty span'), q = el._r.qty, o = { v: 0 };
  gsap.to(o, { v: q, duration: Math.min(1.1, .3 + q / 400), ease: 'power2.out', onUpdate: () => { span.textContent = Math.round(o.v); Sfx.tick(); } });
  gsap.fromTo(el.querySelector('.qty'), { scale: 1.6 }, { scale: 1, duration: .5, ease: 'elastic.out(1.2,.35)' });
}
async function claim() {
  if (S.state !== 'cards') return;
  S.state = 'anim'; setPhase('claim'); killLoop('auto');
  showBtn(null, false);
  const flights = [];
  const fly = (el, kind, total, n) => {
    const r = el.getBoundingClientRect(), tgt = bal[kind].pill.querySelector('svg').getBoundingClientRect();
    const tx = tgt.left + tgt.width / 2, ty = tgt.top + tgt.height / 2;
    for (let i = 0; i < n; i++) {
      const sx = r.left + r.width / 2 + rand(-20, 20), sy = r.top + r.height * .45 + rand(-20, 20);
      const c1x = sx + rand(-200, 200), c1y = sy - rand(80, 240), c2x = tx + rand(-160, 40), c2y = ty + rand(80, 220);
      flights.push(new Promise(res => gsap.delayedCall(i * .045, () => FX.add({
        type: kind, norm: true, layer: 2, mode: 'bez', b: [sx, sy, c1x, c1y, c2x, c2y, tx, ty], x: sx, y: sy, vx: 0, vy: 0, life: rand(.75, 1.0), size: 26, vr: rand(8, 14), fo: .02, fin: .08,
        onDone: () => { addBalance(kind, total / n); kind === 'coin' ? Sfx.coin() : Sfx.gem(); FX.add({ type: 'star', layer: 2, x: tx, y: ty, vx: rand(-80, 80), vy: rand(-80, 80), drag: 3, life: .4, size: 9, color: '#fff' }); res(); } }))));
    }
  };
  const coinEl = cardEls.find(e => e._r.kind === 'coin'), gemEl = cardEls.find(e => e._r.kind === 'gem');
  fly(coinEl, 'coin', coinEl._r.qty, Math.round(clamp(coinEl._r.qty / 30, 12, 26)));
  fly(gemEl, 'gem', gemEl._r.qty, Math.round(clamp(gemEl._r.qty / 3, 8, 18)));
  gsap.to(cardEls, { y: '-=14', duration: .2, ease: 'power2.out', stagger: .04 });
  gsap.to(cardEls, { scale: .6, opacity: 0, duration: .35, ease: 'back.in(2)', stagger: .06, delay: .5 });
  await Promise.all(flights);
  await wait(.25);
  $('#cards').innerHTML = ''; cardEls = [];
  beamsOff(.6); gsap.to(M.core, { emissiveIntensity: .5, duration: .6 });
  S.state = 'done'; setPhase('done');
  showBtn(L().again);
}

/* =====================================================================
   15. FLOW / STATE MACHINE
   ===================================================================== */
async function openChest() {
  S.state = 'anim'; stopIdle(); setPrompt(false);
  await charge();
  await burst();
  if (S.finalTier >= 2) await heroReveal();
  else await cardsReveal();
}
async function runAuto() {
  S.state = 'anim'; stopIdle(); setPrompt(false);
  while (S.tier < S.finalTier) { await upgrade(); await wait(.3); }
  await wait(.15);
  await openChest();
}
function rollFinal() { if (S.forceFinal) return S.forceFinal; if (S.mode === 'auto') return 3; const r = Math.random(); return r < .3 ? 1 : r < .62 ? 2 : 3; }
function onStageTap() {
  if (S.state === 'idle') {
    if (S.tier === 0) S.finalTier = rollFinal();
    if (S.mode === 'auto') { runAuto(); return; }
    if (S.tier < S.finalTier) {
      S.state = 'anim'; stopIdle(); setPrompt(false);
      upgrade().then(() => gsap.delayedCall(.1, toIdle));
    } else openChest();
  } else if (S.state === 'hero') continueFromHero();
}
async function replay() {
  if (S.state !== 'done') return;
  S.state = 'anim'; setPhase('reset');
  showBtn(null, false);
  killLoop('turn', 'bob', 'hintDelay', 'hint', 'idleReturn');
  beamsOff(.3);
  gsap.to(view, { shift: 0, zoom: 0, duration: .5, ease: 'power2.inOut', onUpdate: () => updateScreenAnchors(true) });
  gsap.to('#plate', { autoAlpha: 1, y: 0, duration: .3 });
  const tl = gsap.timeline();
  tl.to(lidG.rotation, { x: 0, duration: .45, ease: 'bounce.out' })
    .to(M.core, { emissiveIntensity: 0, duration: .3 }, 0).to(innerL, { intensity: 0, duration: .3 }, 0)
    .add(() => {
      S.lidOpen = false; S.tier = 0; Sfx.land();
      applyTierColors(0, .25); setPlate(0, true); slamTitle(TIERS[0].en);
      ring(SP.chest.x, SP.floor, 160, TIERS[0].light, 5, .45, .28);
    }, .3)
    .to(squashG.scale, { x: 1.2, z: 1.2, y: .8, duration: .08 }, .3)
    .to(squashG.scale, { x: 1, y: 1, z: 1, duration: .5, ease: 'elastic.out(1.1,.35)' }, .38);
  await tlDone(tl);
  toIdle();
}

/* input: animation-in-progress taps are ignored, never queued */
$('#app').addEventListener('pointerdown', () => Sfx.init(), { passive: true });
$('#app').addEventListener('click', e => { if (e.target.closest('#hud') || e.target.closest('.btn')) return; onStageTap(); });
$('#btnMain').addEventListener('click', e => {
  e.stopPropagation(); Sfx.init();
  if (S.state === 'hero') continueFromHero();
  else if (S.state === 'cards') claim();
  else if (S.state === 'done') replay();
});
$('#modeSeg').addEventListener('click', e => {
  e.stopPropagation(); Sfx.init();
  const b = e.target.closest('button'); if (!b) return;
  if (!(S.state === 'idle' && S.tier === 0) && S.state !== 'done') { gsap.fromTo('#modeSeg', { x: -6 }, { x: 0, duration: .4, ease: 'elastic.out(1.5,.3)' }); return; }
  S.mode = b.dataset.mode;
  document.querySelectorAll('#modeSeg button').forEach(x => x.classList.toggle('on', x === b));
  Sfx.pop(); if (S.state === 'idle') setPrompt(true);
});
$('#muteBtn').addEventListener('click', e => { e.stopPropagation(); Sfx.init(); Sfx.setMuted(!Sfx.muted); $('#muteBtn').innerHTML = muteIcon(Sfx.muted); });
$('#langBtn').addEventListener('click', e => { e.stopPropagation(); Sfx.init(); S.lang = S.lang === 'zh' ? 'pt' : 'zh'; document.documentElement.lang = S.lang === 'zh' ? 'zh' : 'pt'; refreshTexts(); Sfx.pop(); });
$('#muteBtn').innerHTML = muteIcon(false);
addEventListener('resize', resize);

/* =====================================================================
   16. RENDER LOOP
   ===================================================================== */
function renderFrame() {
  updateCamera();
  // soft contact shadow follows height
  if (medalRoot.visible && S.heroOn) {
    const h = medalRoot.position.y + medalSpin.position.y;
    shadowMesh.scale.set(2.6 * medalRoot.scale.x, 1.1 * medalRoot.scale.x, 1);
    shadowMesh.material.opacity = clamp(.5 - h * .08, .12, .45);
  } else {
    const h = chestRoot.position.y + idleG.position.y;
    const k = clamp(1 - h * .3, .45, 1);
    shadowMesh.position.x = 0;
    shadowMesh.scale.set(4.4 * k * squashG.scale.x, 3.3 * k * squashG.scale.z, 1);
    shadowMesh.material.opacity = .85 * k;
    shadowMesh.visible = chestRoot.visible;
  }
  renderer.setRenderTarget(rtColor); renderer.clear(); renderer.render(scene, camera);
  scene.overrideMaterial = ndMat;
  renderer.setRenderTarget(rtND); renderer.clear(); renderer.render(scene, camera);
  scene.overrideMaterial = null;
  renderer.setRenderTarget(null); renderer.clear();
  renderer.render(shadowScene, camera);
  renderer.render(postScene, postCam);
}
gsap.ticker.add((time, dms) => {
  const dt = Math.min(dms / 1000, S.dtCap || .05) * gsap.globalTimeline.timeScale();
  scene.updateMatrixWorld();
  mouthObj.getWorldPosition(_w); SP.mouth = toScreen(_w);
  if (S.heroOn) updateMedalScreen();
  if (loops.beams) { beamsEl.style.left = SP.mouth.x + 'px'; beamsEl.style.top = SP.mouth.y + 'px'; }
  renderFrame();
  FX.frame(dt);
});

/* =====================================================================
   17. BOOT — first frame is already the full idle scene
   ===================================================================== */
applyTierColors(0, 0);
M.wood.forEach((m, i) => m.color.set(TIERS[0].wood[i]));
resize();
refreshTexts(); setPlate(0, false);
renderer.compile(scene, camera);
renderFrame();
slamTitle(TIERS[0].en);
toIdle();
</script>
